<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Our Shopping Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .welcome-text {
            text-align: center;
            margin: 20px;
        }

        .welcome-text h2 {
            font-size: 36px;
        }

        .welcome-text p {
            font-size: 18px;
        }

        .cta-button {
            text-align: center;
        }

        .cta-button a {
            display: inline-block;
            padding: 15px 30px;
            background: #007BFF;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .cta-button a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Shopping Website</h1>
    </header>
    <div class="container">
        <div class="welcome-text">
            <h2>Explore Our Latest Collections</h2>
            <p>Discover a wide range of products at the best prices. Shop now and enjoy a seamless shopping experience.</p>
        </div>
        <div class="cta-button">
            <a href="shop.html">Shop Now</a>
        </div>
    </div>
</body>
</html>
