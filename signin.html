<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
    <title>Sign In</title>
</head>
<body>
    <div class="container">
        <h1>Sign In</h1>
        <form id="signInForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
        <div class="divider">
            <span>or</span>
        </div>
        <button class="google-btn">Sign Up with your Google account</button>
        <p class="phone-text">Don't have an account? Enter your Email/phone number to sign up:</p>
        <form id="phoneSignUpForm">
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your Email/phone number" required>
            <button type="submit">Sign Up with Email/Phone Number</button>
        </form>
    </div>
</body>
</html>
